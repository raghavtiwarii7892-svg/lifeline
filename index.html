<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lifeline – medical records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--surface:#f4f9fa;--ink:#12303d;--muted:#58707c;--line:#d9e6ea;--blue:#1f6fb2;--teal:#0d8f8a;--tealsoft:#e4f4f3;--bluesoft:#e8f1fa;--warn:#fff4d6;--warnink:#7a5200;--danger:#b3363f;--ok:#14794f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1rem}
p{margin:0 0 .6em}.muted{color:var(--muted);font-size:.9rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.proto{background:var(--warn);color:var(--warnink);font-size:.85rem;padding:8px 16px;text-align:center}
header.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.2rem;color:var(--blue)}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button,.who button{background:none;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button.on{background:var(--bluesoft);color:var(--blue);font-weight:600}
.who{display:flex;align-items:center;gap:6px;font-size:.9rem;color:var(--muted)}
main{max-width:980px;margin:0 auto;padding:20px 16px 90px}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg);margin-bottom:16px}
.card.soft{background:var(--surface)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.badge{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--bluesoft);color:var(--blue)}
.badge.warn{background:var(--warn);color:var(--warnink)}.badge.ok{background:var(--tealsoft);color:var(--ok)}.badge.bad{background:#fde7e8;color:var(--danger)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
:root[data-theme="dark"] .btn,.btn.t{}
.btn.teal{background:var(--teal);color:#fff}.btn.ghost{background:none;color:var(--blue);border:1px solid var(--line)}.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
textarea{min-height:90px}
.auth{max-width:460px;margin:24px auto}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--bg);color:var(--blue);box-shadow:0 0 0 1px var(--line)}
.stage{border:1px solid var(--line);border-radius:14px;padding:14px;opacity:.6}
.stage.cur{opacity:1;border-color:var(--teal);background:var(--tealsoft)}
.stage h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.kv b{display:block;font-size:.8rem;color:var(--muted);font-weight:500}
.tl{position:relative;margin:0;padding:0 0 0 22px;list-style:none;border-left:2px solid var(--line)}
.tl li{position:relative;margin-bottom:14px}
.tl li::before{content:"";position:absolute;left:-29px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:3px solid var(--bg)}
.tl li.sys::before{background:var(--blue)}
.rec{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}
.rec .meta{font-size:.82rem;color:var(--muted);margin-top:6px}
.exp{font-variant-numeric:tabular-nums;font-weight:700;color:var(--teal)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:40;max-width:90vw}
.empty{text-align:center;padding:28px;color:var(--muted)}
@media (max-width:700px){
 header.top{padding:10px 14px}.who span{display:none}
 nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:25;justify-content:space-around}
 nav.tabs button{flex:1;padding:10px 4px;font-size:.85rem}
 .who{margin-left:auto}h1{font-size:1.35rem}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
.av{position:relative;width:34px;height:34px;border-radius:50%;background:var(--bluesoft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:.8rem;cursor:pointer;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}.av input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}.av:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;width:100%;min-height:104px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--bg);cursor:pointer}
.tile:hover{border-color:var(--teal);background:var(--tealsoft)}.tile strong{font-size:1.05rem;color:var(--blue)}
.crumbs{font-size:.9rem;margin:0 0 12px;color:var(--muted)}.crumbs button{background:none;border:0;padding:6px 0;color:var(--blue);font-weight:600;cursor:pointer;min-height:36px}.crumbs [aria-current]{font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div class="proto">Prototype connected to Supabase · use fictional test data only · not security-reviewed</div>
<div id="app"></div>
<script>document.write('<script src="'+(location.protocol==='file:'?'':'/')+'config.js"><\/script>')</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== 1. DATA LAYER (Supabase) =====
   The Project URL and publishable key are safe in browser code: security comes from the
   Row Level Security rules in the database. NEVER put a service_role or secret key here.
   In a bundler project (Vite/Lovable) read these from import.meta.env.VITE_SUPABASE_URL
   and import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY instead of hard-coding them. */
const CONFIG=window.LIFELINE_CONFIG||{}; /* set in config.js */
if(!CONFIG.url||!CONFIG.key)document.addEventListener('DOMContentLoaded',()=>{document.getElementById('app').innerHTML='<p style="padding:24px">Missing config.js: add your Supabase Project URL and publishable key.</p>'});
const sb=supabase.createClient(CONFIG.url,CONFIG.key);
const now=()=>Date.now(), ms=t=>t?new Date(t).getTime():null;
const db={patients:[],doctors:[],records:[],requests:[]}; /* cache of what the signed-in user may see */
const stageKey=a=>a<18?'pediatric':a<60?'adult':'geriatric';
const fail=e=>{if(e){console.error(e);throw e}};
const mapPatient=p=>({avatarUrl:p.avatar_url,uuid:p.id,id:p.patient_code,name:p.full_name,dob:p.date_of_birth,sex:p.sex,bloodGroup:p.blood_group||'',joinedAt:ms(p.joined_at),allergies:'',allergiesVerifiedBy:null,allergyIds:[]});
const mapDoctor=p=>({avatarUrl:p.avatar_url,id:p.id,name:p.full_name,quals:p.qualifications||'',regNo:p.registration_no||'',hospital:p.hospital||''});
const mapGrant=(g,code)=>({id:g.id,doctorId:g.doctor_id,patientId:code,minutes:g.minutes,status:g.status,requestedAt:ms(g.requested_at),expiresAt:ms(g.expires_at)});
const mapRec=(r,code)=>({id:r.id,patientId:code,category:r.category||null,specialty:r.specialty||null,section:catName(r.category)||'Earlier record',spName:subName(r.category,r.specialty),type:r.record_type,title:r.title,note:r.note,author:r.author_name||'Unknown',reg:r.author_reg||'',hospital:r.author_hospital||'',createdAt:ms(r.created_at),addendumTo:r.title.startsWith('Addendum: ')?r.title.slice(10):undefined});
const startRec=p=>({id:'start-'+p.id,patientId:p.id,section:'system',type:'Lifeline started',title:'Lifeline record started',note:'Your lifelong record begins today. Earlier history is not required.',author:'Lifeline',createdAt:p.joinedAt,system:true});
function applyAllergies(p,rows){p.allergyIds=rows.map(a=>a.id);p.allergies=rows.map(a=>a.description).join('; ');const v=rows.length&&rows.every(a=>a.verified_at);p.allergiesVerifiedBy=v?`${rows[0].verified_by_name||'a professional'} · ${fmtDate(rows[0].verified_at)}`:null}

const api={
 /* auth */
 async loadMe(){const{data:{session}}=await sb.auth.getSession();if(!session)return null;
  const{data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();fail(error);
  if(!data)return null;S.role=data.role;return data.role==='doctor'?mapDoctor(data):mapPatient(data)},
 async signIn(email,pw){const{error}=await sb.auth.signInWithPassword({email,password:pw});fail(error)},
 /* The profile row (name, role, date of birth...) is created by a database trigger from
    this sign-up metadata, so it also works when email confirmation is switched on. */
 async register(role,v){const meta=role==='doctor'?{role,full_name:v.name,qualifications:v.quals,registration_no:v.regNo,hospital:v.hospital}
   :{role,full_name:v.name,date_of_birth:v.dob,sex:v.sex,allergies:v.allergies||''};
  const{data,error}=await sb.auth.signUp({email:v.email,password:v.pw,options:{data:meta,emailRedirectTo:redirectTo}});fail(error);
  return data.session?'ok':'confirm'},
 signOut:()=>sb.auth.signOut(),
 /* load everything the signed-in user is allowed to see into the cache */
 async sync(){const me=S.user;if(!me)return;
  if(S.role==='patient'){
   const q=await Promise.all([sb.from('allergies').select('*').eq('patient_id',me.uuid),sb.from('medical_records').select('*').eq('patient_id',me.uuid),
    sb.from('access_grants').select('*').eq('patient_id',me.uuid),sb.from('profiles').select('*').eq('role','doctor')]);
   q.forEach(x=>fail(x.error));
   applyAllergies(me,q[0].data);db.patients=[me];db.doctors=q[3].data.map(mapDoctor);
   db.records=[startRec(me),...q[1].data.map(x=>mapRec(x,me.id))];db.requests=q[2].data.map(x=>mapGrant(x,me.id));
  }else{
   db.doctors=[me];db.patients=[];db.records=[];db.requests=[];
   if(!S.open)return;
   const f=await sb.rpc('find_patient',{code:S.open});fail(f.error);const row=f.data&&f.data[0];if(!row)return;
   const p={uuid:row.id,id:row.patient_code,name:row.full_name,dob:null,sex:null,joinedAt:null,allergies:'',allergiesVerifiedBy:null,allergyIds:[]};
   const g=await sb.from('access_grants').select('*').eq('doctor_id',me.id).eq('patient_id',p.uuid);fail(g.error);
   db.patients=[p];db.requests=g.data.map(x=>mapGrant(x,p.id));
   if(db.requests.some(x=>x.status==='approved'&&x.expiresAt>now())){
    const q=await Promise.all([sb.from('profiles').select('*').eq('id',p.uuid).single(),sb.from('allergies').select('*').eq('patient_id',p.uuid),sb.from('medical_records').select('*').eq('patient_id',p.uuid)]);
    q.forEach(x=>fail(x.error));Object.assign(p,mapPatient(q[0].data));applyAllergies(p,q[1].data);
    db.records=[startRec(p),...q[2].data.map(x=>mapRec(x,p.id))];
   }}},
 /* reads from the cache */
 findPatient:id=>db.patients.find(p=>p.id===String(id).trim().toUpperCase()),
 latestRequest(dId,pId){const r=db.requests.filter(r=>r.doctorId===dId&&r.patientId===pId).sort((a,b)=>b.requestedAt-a.requestedAt)[0];api.sweep(r);return r},
 sweep(r){if(r&&r.status==='approved'&&r.expiresAt<=now())r.status='expired';return r},
 hasAccess:(dId,pId)=>{const r=api.latestRequest(dId,pId);return !!r&&r.status==='approved'},
 requestsFor(pId){db.requests.forEach(api.sweep);return db.requests.filter(r=>r.patientId===pId).sort((a,b)=>b.requestedAt-a.requestedAt)},
 recordsFor:pId=>db.records.filter(r=>r.patientId===pId).sort((a,b)=>b.createdAt-a.createdAt),
 /* writes. Records are insert-only: there is deliberately no update or delete. */
 async requestAccess(dId,pId,minutes){const r=await sb.from('access_grants').insert({patient_id:api.findPatient(pId).uuid,minutes});fail(r.error)},
 async respond(id,ok){const r=await sb.rpc('respond_access',{grant_id:id,decision:ok?'approved':'denied'});fail(r.error)},
 async revoke(id){const r=await sb.rpc('respond_access',{grant_id:id,decision:'revoked'});fail(r.error)},
 async addRecord(dId,pId,f){const p=api.findPatient(pId);
  if(!subOf(f.category,f.specialty))throw new Error('Choose a category and specialty');
  const r=await sb.from('medical_records').insert({patient_id:p.uuid,stage:stageKey(ageOf(p.dob)),obg_gynae:f.category==='obgyn',record_type:f.type,title:f.title,note:f.note,category:f.category,specialty:f.specialty});fail(r.error)},
 async setBloodGroup(uuid,bg){if(bg&&!BLOOD.includes(bg))throw new Error('Choose a valid blood group');const r=await sb.from('profiles').update({blood_group:bg||null}).eq('id',uuid);fail(r.error)},
 async confirmAllergies(dId,pId){for(const id of api.findPatient(pId).allergyIds){const r=await sb.rpc('verify_allergy',{allergy_id:id});fail(r.error)}}
};

/* ===== 2. HELPERS ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmtDT=t=>fmtDate(t)+', '+new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const ageOf=dob=>{const b=new Date(dob),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return a};
const left=ms=>{const s=Math.max(0,Math.floor(ms/1e3)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+'h ':'')+m+'m '+String(s%60).padStart(2,'0')+'s'};
const DUR=[[7,'7 minutes'],[60,'1 hour'],[720,'12 hours'],[1440,'24 hours']];
const durLabel=m=>(DUR.find(d=>d[0]===m)||[0,m+' min'])[1];
/* Single source of truth for the department structure. To add a specialty, add one [key,'Name'] pair.
   Keys are stored in medical_records.category / .specialty and checked by a database constraint
   (see supabase/migrations), so add new keys there too. */
const CATALOG=[
 ['medical','Medical','Internal medicine and allied specialties',[['internal-medicine','Internal Medicine'],['dermatology','Dermatology'],['psychiatry','Psychiatry'],['pmr','Physical Medicine & Rehabilitation']]],
 ['surgical','Surgical','Operative and surgical specialties',[['general-surgery','General Surgery'],['ent','ENT'],['ophthalmology','Ophthalmology'],['orthopaedics','Orthopaedics']]],
 ['pediatrics','Pediatrics','Care of infants, children and adolescents',[['general-pediatrics','General Pediatrics'],['neonatology','Neonatology'],['pediatric-subspecialties','Pediatric Subspecialties']]],
 ['obgyn','OBG & Gynaecology','Pregnancy, women’s health and fertility',[['obstetrics','Obstetrics'],['gynaecology','Gynaecology'],['reproductive-medicine','Reproductive Medicine']]],
 ['opd','OPD Visits','Outpatient consultations',[['general-opd','General OPD'],['specialty-opd','Specialty OPD'],['follow-up','Follow-up Consultations']]],
 ['reports','Reports','Test results and documents',[['laboratory','Laboratory'],['radiology','Radiology'],['pathology','Pathology'],['documents','Medical Documents']]]
].map(c=>({key:c[0],name:c[1],desc:c[2],subs:c[3].map(s=>({key:s[0],name:s[1]}))}));
const catOf=k=>CATALOG.find(c=>c.key===k);
const subOf=(c,s)=>(catOf(c)?.subs||[]).find(x=>x.key===s);
const catName=k=>catOf(k)?.name||'';
const subName=(c,s)=>subOf(c,s)?.name||'';
const BLOOD=['A+','A-','B+','B-','AB+','AB-','O+','O-'];
const RECPATH=/^\/records\/([\w-]+)(?:\/([\w-]+))?$/;

/* ===== 3. STATE + VIEWS ===== */
const S={user:null,role:'patient',mode:'login',tab:'home',open:null,toast:'',cat:null,sub:null};
const $app=document.getElementById('app');
const unverified=`<span class="badge warn" title="Entered by the patient">Unverified</span>`;

function authView(){
 const reg=S.mode==='register',doc=S.role==='doctor';
 return `<div class="auth"><div class="brand" style="font-size:1.6rem;margin-bottom:6px">${logo()} Lifeline</div>
 <p class="muted">One medical record, kept for life. Patients stay in control of who sees it.</p>
 <div class="card"><div class="seg" role="tablist"><button data-act="role" data-v="patient" class="${!doc?'on':''}">Patient</button><button data-act="role" data-v="doctor" class="${doc?'on':''}">Doctor</button></div>
 <h2>${reg?'Create your '+(doc?'doctor':'patient')+' account':'Sign in as '+(doc?'a doctor':'a patient')}</h2>
 <form data-form="auth">
 ${reg?`<label>Full name</label><input name="name" required autocomplete="name">`:''}
 ${reg&&!doc?`<label>Date of birth</label><input name="dob" type="date" required max="${new Date().toISOString().slice(0,10)}">
  <label>Sex</label><select name="sex"><option>Female</option><option>Male</option><option>Other</option></select>
  <label>Allergies (optional)</label><input name="allergies" placeholder="e.g. Penicillin"><p class="muted">Anything you enter is shown as unverified until a professional confirms it.</p>`:''}
 ${reg&&doc?`<label>Qualifications</label><input name="quals" required placeholder="e.g. MBBS, MD">
  <label>Medical registration number</label><input name="regNo" required><label>Hospital</label><input name="hospital" required>`:''}
 <label>Email</label><input name="email" type="email" required autocomplete="email" value="">
 <label>Password</label><input name="pw" type="password" required minlength="6" autocomplete="${reg?'new-password':'current-password'}">
 <p class="muted" style="margin-top:10px">Sign-in is handled by Supabase Auth. Prototype only, not security-reviewed.${doc&&reg?' Registration numbers are not verified.':''}</p>
 <button class="btn" style="width:100%">${reg?'Create account':'Sign in'}</button>${reg?'':'<button type="button" class="btn ghost" style="width:100%;margin-top:8px" data-act="forgot">Forgot password?</button>'}</form>
 <p style="margin:14px 0 0;text-align:center"><button class="btn ghost" data-act="mode">${reg?'I already have an account':'Create a new account'}</button></p></div></div>`}

function logo(){return `<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#0d8f8a"/><path d="M3 15h5l3-7 4 12 3-8 2 3h5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

function shell(tabs,body){
 return `<header class="top"><div class="brand">${logo()} Lifeline</div>
 <nav class="tabs">${tabs.map(t=>`<button data-act="tab" data-v="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[1]}</button>`).join('')}</nav>
 <div class="who">${avatar()}<span>${esc(S.user.name)}</span><button data-act="logout">Sign out</button></div></header>
 <main>${body}</main>${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`}

function recCard(r){
 if(r.system)return `<div class="rec"><strong>${esc(r.title)}</strong><p class="muted" style="margin:4px 0 0">${esc(r.note)}</p><div class="meta">${fmtDT(r.createdAt)}</div></div>`;
 return `<div class="rec"><div class="row" style="justify-content:flex-start;gap:8px"><span class="badge">${esc(r.section)}</span>${r.spName?`<span class="badge">${esc(r.spName)}</span>`:''}<span class="badge ok">${esc(r.type)}</span>${r.addendumTo?'<span class="badge warn">Addendum</span>':''}</div>
 <h3 style="margin-top:8px">${esc(r.title)}</h3><p style="margin:0">${esc(r.note)}</p>
 <div class="meta">${esc(r.author)} · Reg. ${esc(r.reg)} · ${esc(r.hospital)}<br>Added ${fmtDT(r.createdAt)}${r.addendumTo?`<br>Corrects or adds to: ${esc(r.addendumTo)}`:''}</div></div>`}
const timeline=(recs,doc,pid)=>recs.length?`<ul class="tl">${recs.map(r=>`<li class="${r.system?'sys':''}">${recCard(r)}${doc&&!r.system?`<button class="btn ghost" style="margin-top:6px;min-height:36px;padding:4px 12px" data-act="addendum" data-v="${esc(r.title)}">Add addendum</button>`:''}</li>`).join('')}</ul>`:'<div class="empty">No records yet.</div>';

/* ---- Reusable category components ---- */
const crumbs=l=>`<nav class="crumbs" aria-label="Breadcrumb">${l.map(x=>x[1]?`<button data-act="nav" data-v="${x[1]}">${esc(x[0])}</button>`:`<span aria-current="page">${esc(x[0])}</span>`).join(' / ')}</nav>`;
const tile=(title,desc,n,path)=>`<button class="tile" data-act="nav" data-v="${path}"><strong>${esc(title)}</strong>${desc?`<span class="muted">${esc(desc)}</span>`:''}<span class="badge ${n?'ok':''}">${n} record${n===1?'':'s'}</span></button>`;
const cnt=(recs,c,s)=>recs.filter(r=>r.category===c&&(!s||r.specialty===s)).length;
const subOpts=(c,sel)=>(catOf(c)?.subs||[]).map(s=>`<option value="${s.key}" ${s.key===sel?'selected':''}>${esc(s.name)}</option>`).join('');
function categoryGrid(recs){const old=recs.filter(r=>!r.category&&!r.system).length;
 return `<div class="grid">${CATALOG.map(c=>tile(c.name,c.desc,cnt(recs,c.key),'/records/'+c.key)).join('')}${old?tile('Earlier records','Saved before categories were introduced',old,'/records/earlier'):''}</div>`}
function recordForm(p){const d=S.user,c=catOf(S.cat)?S.cat:CATALOG[0].key;
 return `<div class="card soft"><h2>Add a clinical record</h2><form data-form="record" data-pid="${p.id}">
  <div class="grid"><div><label style="margin-top:0">Category</label><select name="category" required>${CATALOG.map(x=>`<option value="${x.key}" ${x.key===c?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
  <div><label style="margin-top:0">Specialty</label><select name="specialty" required>${subOpts(c,S.sub)}</select></div>
  <div><label style="margin-top:0">Type</label><select name="type">${['Consultation','Diagnosis','Prescription','Lab result','Procedure','Immunisation'].map(s=>`<option>${s}</option>`).join('')}</select></div></div>
  <label>Title</label><input name="title" required value="${esc(S.draftTitle||'')}" id="rtitle"><label>Clinical notes</label><textarea name="note" required></textarea>
  <p class="muted">Author: ${esc(d.name)} · Reg. ${esc(d.regNo)} · ${esc(d.hospital)}. Date and time are added automatically. Records can’t be edited or deleted; corrections are saved as addendums.</p><button class="btn">Save record</button></form></div>`}
/* One page for every level: category list is the home grid, then category -> specialty -> records */
function recordsPage(recs,doc,p){const c=catOf(S.cat),s=c&&S.sub?subOf(S.cat,S.sub):null,root=doc?'Patient':'Overview',form=doc?recordForm(p):'',pid=p&&p.id;
 if(S.cat==='earlier')return crumbs([[root,'/'],['Earlier records']])+`<h1>Earlier records</h1><p class="muted">Saved before categories were introduced. They can’t be edited${doc?'; add an addendum in the right category to correct or extend them':''}.</p>${form}`+timeline(recs.filter(r=>!r.category&&!r.system),doc,pid);
 if(!s)return crumbs([[root,'/'],[c.name]])+`<h1>${esc(c.name)}</h1><p class="muted">${esc(c.desc)}</p><div class="grid">${c.subs.map(x=>tile(x.name,'',cnt(recs,c.key,x.key),`/records/${c.key}/${x.key}`)).join('')}</div>${form}<h2 style="margin-top:20px">All ${esc(c.name)} records</h2>`+timeline(recs.filter(r=>r.category===c.key),doc,pid);
 return crumbs([[root,'/'],[c.name,'/records/'+c.key],[s.name]])+`<h1>${esc(s.name)}</h1>${form}`+timeline(recs.filter(r=>r.category===c.key&&r.specialty===s.key),doc,pid)}

/* ---- Patient ---- */
function patientView(){
 const p=S.user,age=ageOf(p.dob),recs=api.recordsFor(p.id),reqs=api.requestsFor(p.id),pend=reqs.filter(r=>r.status==='pending');
 const tabs=[['home','Overview'],['timeline','Timeline'],['access','Access'+(pend.length?` (${pend.length})`:'')]];
 let b='';
 if(S.tab==='home'&&S.cat){b=recordsPage(recs,false)}else if(S.tab==='home'){
  b=`<h1>Hello, ${esc(p.name.split(' ')[0])}</h1>
  ${pend.length?`<div class="card" style="background:var(--warn);color:var(--warnink)"><strong>${pend.length} doctor access request${pend.length>1?'s':''} waiting.</strong> <button class="btn" style="margin-left:8px" data-act="tab" data-v="access">Review</button></div>`:''}
  <div class="card"><div class="row"><h2 style="margin:0">Your profile</h2>${unverified} </div>
  <div class="kv" style="margin-top:12px"><div><b>Name</b>${esc(p.name)}</div><div><b>Date of birth</b>${fmtDate(p.dob)}</div><div><b>Age</b>${age} years</div><div><b>Sex</b>${esc(p.sex)}</div>
  <div><b>Blood group</b>${p.bloodGroup?esc(p.bloodGroup):'Not entered'}</div><div><b>Patient ID</b><span style="font-weight:700;color:var(--blue)">${esc(p.id)}</span></div><div><b>Record started</b>${fmtDate(p.joinedAt)}</div></div>
  <p style="margin:14px 0 0"><b class="muted" style="font-weight:500">Allergies</b><br>${p.allergies?esc(p.allergies):'None entered'} ${p.allergies?(p.allergiesVerifiedBy?`<span class="badge ok">Confirmed by ${esc(p.allergiesVerifiedBy)}</span>`:unverified):''}</p>
  <form data-form="bloodgroup" class="row" style="align-items:flex-end;margin-top:14px"><div style="flex:1;min-width:160px"><label style="margin-top:0" for="bgsel">Blood group (optional)</label><select name="bg" id="bgsel"><option value="">Not set</option>${BLOOD.map(x=>`<option ${x===p.bloodGroup?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn ghost">Save</button></form>
  <p class="muted" style="margin:10px 0 0">Information you enter yourself stays unverified until an authorised professional confirms it.</p></div>
  <h2>Medical categories</h2>${categoryGrid(recs)}`;
 }else if(S.tab==='timeline'){
  b=`<h1>Medical timeline</h1><p class="muted">Newest first. Your record starts on ${fmtDate(p.joinedAt)}. You can view records here; only doctors you approve can add to them.</p>${timeline(recs)}`;
 }else{
  b=`<h1>Doctor access</h1><p class="muted">Doctors can only see your full history after you approve. Access ends automatically.</p>
  ${reqs.length?reqs.map(r=>{const d=db.doctors.find(d=>d.id===r.doctorId)||{name:'A doctor',quals:'',hospital:''};
   return `<div class="card"><div class="row"><div><strong>${esc(d.name)}</strong><br><span class="muted">${esc(d.quals)} · ${esc(d.hospital)}</span></div>
   <span class="badge ${r.status==='approved'?'ok':r.status==='pending'?'warn':'bad'}">${r.status[0].toUpperCase()+r.status.slice(1)}</span></div>
   <p style="margin:10px 0">Requested ${fmtDT(r.requestedAt)} · Duration ${durLabel(r.minutes)}</p>
   ${r.status==='pending'?`<p class="muted">Access starts when you approve, and lasts ${durLabel(r.minutes)}.</p><div class="row" style="justify-content:flex-start"><button class="btn teal" data-act="approve" data-v="${r.id}">Approve</button><button class="btn danger" data-act="deny" data-v="${r.id}">Deny</button></div>`:''}
   ${r.status==='approved'?`<p>Expires ${fmtDT(r.expiresAt)} · <span class="exp" data-exp="${r.expiresAt}">${left(r.expiresAt-now())}</span> left</p><button class="btn danger" data-act="revoke" data-v="${r.id}">End access now</button>`:''}
   ${r.status==='expired'?`<p class="muted">Ended ${fmtDT(r.expiresAt)}</p>`:''}</div>`}).join(''):'<div class="empty">No access requests yet.</div>'}`;
 }
 return shell(tabs,b)}

/* ---- Doctor ---- */
function doctorView(){
 const d=S.user,tabs=[['home','Patients'],['profile','My profile']];
 if(S.cat&&S.tab==='home'){const p=S.open&&api.findPatient(S.open),r=p&&api.latestRequest(d.id,p.id);
  if(p&&r&&r.status==='approved')return shell(tabs,`<div class="card"><div class="row"><div><strong>${esc(p.name)}</strong><br><span class="muted">${esc(p.id)}</span></div><span class="badge ok">Access · <span class="exp" data-exp="${r.expiresAt}">${left(r.expiresAt-now())}</span> left</span></div></div>`+recordsPage(api.recordsFor(p.id),true,p));
  S.cat=S.sub=null;setTimeout(()=>go('/',true))} /* access ended: back to patient search */
 let b='';
 if(S.tab==='profile'){
  b=`<h1>My profile</h1><div class="card"><div class="kv"><div><b>Name</b>${esc(d.name)}</div><div><b>Qualifications</b>${esc(d.quals)}</div><div><b>Registration no.</b>${esc(d.regNo)}</div><div><b>Hospital</b>${esc(d.hospital)}</div></div>
  <p style="margin:14px 0 0"><span class="badge warn">Registration not verified</span></p><p class="muted">In a real system, registration numbers would be checked against the medical council before access is granted.</p></div>`;
 }else{
  b=`<h1>Find a patient</h1><div class="card"><form data-form="search" class="row" style="align-items:flex-end"><div style="flex:1;min-width:220px"><label style="margin-top:0">Patient ID</label><input name="pid" placeholder="LL-4829-7731" value="${esc(S.open||'')}" autocapitalize="characters" required></div><button class="btn">Search</button></form>
  <p class="muted" style="margin:10px 0 0">Ask the patient for their Lifeline ID. It is shown on their Overview screen.</p></div>`;
  if(S.open){
   const p=api.findPatient(S.open);
   if(!p)b+=`<div class="card empty">No patient found with that ID. Check the ID and try again.</div>`;
   else{
    const r=api.latestRequest(d.id,p.id),ok=r&&r.status==='approved';
    b+=`<div class="card"><div class="row"><div><h2 style="margin:0">${esc(p.name)}</h2><span class="muted">${esc(p.id)}</span></div>${ok?'<span class="badge ok">Access granted</span>':r&&r.status==='pending'?'<span class="badge warn">Awaiting patient</span>':'<span class="badge bad">No access</span>'}</div>
    ${ok?`<div class="kv" style="margin-top:12px"><div><b>Age</b>${ageOf(p.dob)} years</div><div><b>Sex</b>${esc(p.sex)}</div><div><b>Blood group (patient-reported)</b>${p.bloodGroup?esc(p.bloodGroup):'Not entered'}</div></div>
     <p style="margin:12px 0 0"><b class="muted" style="font-weight:500">Allergies (patient-reported)</b><br>${p.allergies?esc(p.allergies):'None entered'} ${p.allergies?(p.allergiesVerifiedBy?`<span class="badge ok">Confirmed by ${esc(p.allergiesVerifiedBy)}</span>`:unverified+` <button class="btn ghost" style="min-height:32px;padding:2px 10px" data-act="confirmAllergy" data-v="${p.id}">Confirm</button>`):''}</p>
     <p style="margin:12px 0 0;padding:10px;background:var(--tealsoft);border-radius:10px">Access expires <strong>${fmtDT(r.expiresAt)}</strong> · <span class="exp" data-exp="${r.expiresAt}">${left(r.expiresAt-now())}</span> left</p>`
    :r&&r.status==='pending'?`<p style="margin:12px 0 0">Request for ${durLabel(r.minutes)} sent ${fmtDT(r.requestedAt)}. The patient must approve before you can view records.</p>`
    :`<p class="muted" style="margin:12px 0 0">${r&&r.status==='expired'?'Your previous access has ended. ':r&&r.status==='denied'?'The patient declined your last request. ':''}Request access to this patient’s complete medical history.</p>
     <form data-form="request" data-pid="${p.id}"><label>Access duration</label><select name="mins">${DUR.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select><p class="muted">The timer starts when the patient approves.</p><button class="btn teal">Request access</button></form>`}</div>`;
    if(ok){
     b+=recordForm(p)+`<h2>Medical categories</h2>${categoryGrid(api.recordsFor(p.id))}<h2 style="margin-top:20px">All records</h2>${timeline(api.recordsFor(p.id),true,p.id)}`;
    }
   }
  }
 }
 return shell(tabs,b)}

function render(){const y=window.scrollY;let h=!ready?'<div class="empty">Loading…</div>':S.recovery?recoveryView():!S.user?authView():S.role==='doctor'?doctorView():patientView();
 if(S.toast&&(!ready||S.recovery||!S.user))h+=`<div class="toast" role="status">${esc(S.toast)}</div>`;$app.innerHTML=h;window.scrollTo(0,y)}
function say(m){S.toast=m;render();setTimeout(()=>{S.toast='';render()},2200)}

/* ===== 4. EVENTS ===== */
const A={
 role:b=>{S.role=b.dataset.v;render()},mode:()=>{S.mode=S.mode==='login'?'register':'login';render()},
 tab:b=>{S.tab=b.dataset.v;render()},logout:()=>{S.user=null;S.open=null;S.tab='home';S.mode='login';render()},
 approve:b=>{api.respond(b.dataset.v,true);say('Access approved')},deny:b=>{api.respond(b.dataset.v,false);say('Request denied')},
 revoke:b=>{api.revoke(b.dataset.v);say('Access ended')},
 confirmAllergy:b=>{api.confirmAllergies(S.user.id,b.dataset.v);say('Allergies confirmed')},
 addendum:b=>{S.draftTitle='Addendum: '+b.dataset.v;render();document.getElementById('rtitle')?.scrollIntoView({block:'center'});S.draftTitle=''}
};
A.confirmAllergies=null;A.confirmAllergy=b=>{api.confirmAllergies(S.user.id,b.dataset.v);say('Allergies confirmed')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])A[b.dataset.act](b)});
/* ===== 4b. ROUTING + AUTH GUARD =====
   Paths: /login (public), and / , /timeline, /access (patients), /profile (doctors).
   Hosted over http(s) it uses real paths (needs the SPA fallback in _redirects / vercel.json);
   opened from a file it falls back to #/ paths. */
const PATHTAB={'/':'home','/timeline':'timeline','/access':'access','/profile':'profile'};
const TABPATH=Object.fromEntries(Object.entries(PATHTAB).map(([p,t])=>[t,p]));
const HASH=location.protocol==='file:';
const redirectTo=HASH?undefined:location.origin+'/login';
let ready=false;
const curPath=()=>(HASH?location.hash.replace(/^#/,''):location.pathname).replace(/\/+$/,'')||'/';
const go=(p,rep)=>{
 if(HASH&&curPath()!==p){rep?location.replace('#'+p):(location.hash=p);return}
 if(!HASH&&curPath()!==p)history[rep?'replaceState':'pushState'](null,'',p);
 route()};
function route(){
 if(!ready)return;
 if(S.recovery)return render();
 const p=curPath();
 if(!S.user){if(p!=='/login'){S.next=p;return go('/login',true)}return render()}
 if(p==='/login'){const n=S.next;S.next=null;return go(n&&PATHTAB[n]?n:'/',true)}
 const rm=p.match(RECPATH);
 if(rm){const c=rm[1],s=rm[2],valid=c==='earlier'?!s:!!catOf(c)&&(!s||!!subOf(c,s));
  const pt=S.role==='doctor'&&S.open&&api.findPatient(S.open);
  if(!valid||(S.role==='doctor'&&!(pt&&api.hasAccess(S.user.id,pt.id))))return go('/',true);
  S.tab='home';S.cat=c;S.sub=s||null;return render()}
 const t=PATHTAB[p],allowed=S.role==='doctor'?['home','profile']:['home','timeline','access'];
 if(!t||!allowed.includes(t))return go('/',true);
 S.cat=S.sub=null;S.tab=t;render()}
addEventListener(HASH?'hashchange':'popstate',route);

const initials=n=>n.replace(/^Dr\.?\s+/i,'').split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const avatar=()=>`<label class="av" title="Change profile photo">${S.user.avatarUrl?`<img src="${esc(S.user.avatarUrl)}" alt="">`:esc(initials(S.user.name))}<input type="file" id="avf" accept="image/png,image/jpeg,image/webp" aria-label="Upload profile photo"></label>`;
const recoveryView=()=>`<div class="auth"><div class="brand" style="font-size:1.6rem;margin-bottom:6px">${logo()} Lifeline</div><div class="card"><h2>Set a new password</h2><form data-form="newpw"><label>New password</label><input name="pw" type="password" minlength="6" required autocomplete="new-password"><button class="btn" style="width:100%;margin-top:14px">Save password</button></form></div></div>`;
const clearCache=()=>{S.cat=S.sub=null;S.user=null;S.open=null;S.mode='login';Object.assign(db,{patients:[],doctors:[],records:[],requests:[]})};

sb.auth.onAuthStateChange(ev=>{
 if(ev==='PASSWORD_RECOVERY'){S.recovery=true;if(ready)render()}
 if(ev==='SIGNED_OUT'&&S.user){clearCache();route()}});

const busy=async(fn,msg)=>{try{await fn();await api.sync();say(msg)}catch(e){say(e.message||'Something went wrong')}};
Object.assign(A,{
 tab:b=>go(TABPATH[b.dataset.v]||'/'),
 nav:b=>{go(b.dataset.v);scrollTo(0,0)},
 logout:async()=>{try{await api.signOut()}catch(e){console.error(e)}clearCache();S.next=null;go('/login',true)},
 forgot:async()=>{const em=document.querySelector('[name=email]')?.value.trim();if(!em)return say('Enter your email first');
  try{const r=await sb.auth.resetPasswordForEmail(em,{redirectTo});fail(r.error);say('If that email has an account, a reset link is on its way')}catch(e){say(e.message)}},
 approve:b=>busy(()=>api.respond(b.dataset.v,true),'Access approved'),
 deny:b=>busy(()=>api.respond(b.dataset.v,false),'Request denied'),
 revoke:b=>busy(()=>api.revoke(b.dataset.v),'Access ended'),
 confirmAllergy:b=>busy(()=>api.confirmAllergies(S.user.id,b.dataset.v),'Allergies confirmed')
});

document.addEventListener('change',e=>{if(e.target.name!=='category')return;const sp=e.target.form&&e.target.form.elements.specialty;if(sp)sp.innerHTML=subOpts(e.target.value)});
document.addEventListener('change',async e=>{
 if(e.target.id!=='avf'||!S.user)return;const f=e.target.files[0];if(!f)return;
 if(f.size>2*1024*1024)return say('Choose an image under 2 MB');
 try{const uid=S.user.uuid||S.user.id,ext=(f.type.split('/')[1]||'png').replace('jpeg','jpg'),path=`${uid}/avatar-${Date.now()}.${ext}`;
  let r=await sb.storage.from('avatars').upload(path,f,{contentType:f.type});fail(r.error);
  const url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
  r=await sb.from('profiles').update({avatar_url:url}).eq('id',uid);fail(r.error);
  S.user.avatarUrl=url;say('Photo updated')}catch(err){say(err.message||'Upload failed')}});

document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,k=f.dataset.form,v=Object.fromEntries(new FormData(f)),btn=f.querySelector('button');if(btn)btn.disabled=true;
 try{
  if(k==='auth'){
   if(S.mode==='register'){const r=await api.register(S.role,v);if(r==='confirm'){S.mode='login';say('Check your email to confirm your account, then sign in');return}}
   else await api.signIn(v.email,v.pw);
   S.user=await api.loadMe();
   if(!S.user){await api.signOut();throw new Error('No Lifeline profile found for this account')}
   await api.sync();route()}
  if(k==='newpw'){const r=await sb.auth.updateUser({password:v.pw});fail(r.error);S.recovery=false;S.user=await api.loadMe();if(S.user)await api.sync();say('Password updated');route()}
  if(k==='search'){S.open=v.pid.trim().toUpperCase();await api.sync();render()}
  if(k==='request'){await api.requestAccess(S.user.id,f.dataset.pid,+v.mins);await api.sync();say('Request sent to patient')}
  if(k==='bloodgroup'){await api.setBloodGroup(S.user.uuid,v.bg);S.user.bloodGroup=v.bg||'';say('Blood group saved')}
  if(k==='record'){await api.addRecord(S.user.id,f.dataset.pid,v);await api.sync();say('Record saved')}
 }catch(err){say(err.message||'Something went wrong')}
});
setInterval(()=>{let end=false;document.querySelectorAll('[data-exp]').forEach(el=>{const l=+el.dataset.exp-now();if(l<=0)end=true;else el.textContent=left(l)});if(end){db.requests.forEach(api.sweep);api.sync().catch(()=>{}).then(render)}},1000);
(async()=>{try{S.user=await api.loadMe();if(S.user)await api.sync()}catch(e){console.error(e)}ready=true;route()})();
</script>
</body>
</html>
